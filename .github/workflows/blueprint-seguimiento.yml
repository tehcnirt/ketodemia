name: Seguimiento local de Blueprint
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  seguimiento-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar seguimiento Blueprint sin red ni credenciales
        run: python3 herramientas/tests/test_seguimiento_blueprint.py
